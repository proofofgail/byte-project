  <script>
  (function () {
    var NS = 'http://www.w3.org/2000/svg';
    var page = document.getElementById('page');
    var svg = page.querySelector('.wordmark');
    var sweepsG = document.getElementById('sweeps');
    var sparkG = document.getElementById('sparkles');
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var cols = ['#ffffff', '#eef2f6', '#b9c2cc', '#f8fafc', '#98a3b0', '#ffffff'];

    function parse(el) {
      return el.getAttribute('points').trim().split(/\s+/).map(function (p) { return p.split(',').map(Number); });
    }
    var traces = Array.prototype.map.call(document.querySelectorAll('#traces polyline'), function (el) {
      return { p: parse(el), deco: el.hasAttribute('data-deco') };
    });
    var smallPads = Array.prototype.filter.call(document.querySelectorAll('#pads circle'), function (c) {
      return c.getAttribute('r') === '3.5';
    }).map(function (c) { return { x: +c.getAttribute('cx'), y: +c.getAttribute('cy') }; });

    function seglen(p) { var l = 0; for (var k = 0; k < p.length - 1; k++) l += Math.hypot(p[k+1][0]-p[k][0], p[k+1][1]-p[k][1]); return l; }
    function str(p) { return p.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
    function spark(x, y, r, delay) {
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r);
      c.style.animation = 'twinkle 1.7s ease-in-out ' + delay + 's both';
      sparkG.appendChild(c);
    }

    var timer;
    function fire(o) {
      sweepsG.textContent = ''; sparkG.textContent = '';
      void svg.getBoundingClientRect();
      traces.forEach(function (tr, i) {
        var pts = tr.p, best = { d: 1e9, seg: 0, pt: pts[0] };
        for (var j = 0; j < pts.length - 1; j++) {
          var a = pts[j], b = pts[j+1], vx = b[0]-a[0], vy = b[1]-a[1], L2 = vx*vx + vy*vy || 1;
          var t = Math.max(0, Math.min(1, ((o.x-a[0])*vx + (o.y-a[1])*vy) / L2));
          var px = a[0] + vx*t, py = a[1] + vy*t, d = Math.hypot(o.x-px, o.y-py);
          if (d < best.d) best = { d: d, seg: j, pt: [px, py] };
        }
        var delay = +(best.d/520 + (i % 9) * 0.03).toFixed(2);
        var col = cols[i % cols.length];
        var halves = [[best.pt].concat(pts.slice(best.seg+1)), [best.pt].concat(pts.slice(0, best.seg+1).reverse())];
        halves.forEach(function (p) {
          var L = seglen(p);
          if (p.length < 2 || L < 3) return;
          var dur = +Math.max(0.4, L/300).toFixed(2);
          var pl = document.createElementNS(NS, 'polyline');
          pl.setAttribute('points', str(p));
          pl.setAttribute('pathLength', '100');
          pl.setAttribute('stroke', col);
          pl.style.animation = 'sweep ' + dur + 's linear ' + delay + 's both';
          sweepsG.appendChild(pl);
          if (tr.deco) { var e = p[p.length-1]; spark(e[0].toFixed(1), e[1].toFixed(1), 4, +(delay + dur*0.75).toFixed(2)); }
        });
      });
      smallPads.forEach(function (p) { spark(p.x, p.y, 3.5, +(Math.hypot(p.x-o.x, p.y-o.y)/520).toFixed(2)); });
      clearTimeout(timer);
      timer = setTimeout(function () { sweepsG.textContent = ''; sparkG.textContent = ''; }, 4600);
    }

    page.addEventListener('click', function (e) {
      if (reduced || e.target.closest('#signup')) return;
      var r = svg.getBoundingClientRect();
      fire({ x: 35 + (e.clientX - r.left) / r.width * 1120, y: 30 + (e.clientY - r.top) / r.height * 600 });
    });

    // Mailing list: submit quietly in the background, then show the confirmation line.
    var form = document.getElementById('form'), input = document.getElementById('email');
    var btn = document.getElementById('btn'), thanks = document.getElementById('thanks');
    var frame = document.createElement('iframe');
    frame.name = 'buttondown_target'; frame.setAttribute('aria-hidden', 'true'); frame.tabIndex = -1;
    frame.style.cssText = 'position:absolute;width:0;height:0;border:0;opacity:0;pointer-events:none';
    document.getElementById('signup').appendChild(frame);
    form.target = 'buttondown_target';
    form.noValidate = true;
    form.addEventListener('submit', function (e) {
      var v = input.value.trim();
      if (!v || v.indexOf('@') < 0) {
        e.preventDefault();
        input.classList.add('invalid');
        setTimeout(function () { input.classList.remove('invalid'); }, 1500);
        return;
      }
      setTimeout(function () {
        btn.disabled = true; btn.textContent = 'sending…';
        setTimeout(function () { form.hidden = true; thanks.hidden = false; }, 400);
      }, 0);
    });
  })();
  </script>
